# Parâmetros do CD fictício (Sapucaí Distribution Center - SDC)
# ATENÇÃO: todos os valores são ESTIMATIVAS de ordem de grandeza.
# Posições de palete calibradas na Fase 1 (derivadas de config/layout.yaml). Edite aqui, nunca no código.

simulation:
  seed: 42            # semente fixa: mesma semente = mesmos dados (reprodutibilidade)
  scale: 0.1          # 0.1 = 10% do volume (desenvolvimento) | 1.0 = volume completo
  months: 24          # horizonte simulado
  start_date: "2024-11-01"   # início do período simulado (24 meses: nov/2024 a out/2026)

facility:
  name: "Sapucaí Distribution Center (SDC)"
  region: "Sul de Minas, atende MG, SP e RJ"
  area_m2: 25000
  ceiling_height_m: 12
  zones:
    dry:      { pallet_positions: 13824, temp_c: "ambiente" }
    chilled:  { pallet_positions: 2400,  temp_c: "0 a 8" }
    frozen:   { pallet_positions: 1920,  temp_c: "<= -18" }
  docks:
    dry: 16
    chilled: 4
    frozen: 4

catalog:
  skus: 6000
  skus_by_zone: { dry: 4500, chilled: 900, frozen: 600 }   # estimativa
  suppliers: 150

demand:
  b2b:
    stores: 1500
    orders_per_day: 800
    lines_per_order: 35
  ecommerce:
    orders_per_day: 1500
    lines_per_order: 4

operations:
  # Recebimento de dia, separação à noite, expedição de madrugada
  shifts: ["receiving_day", "picking_night", "shipping_dawn"]
  min_shelf_life_on_receipt_pct: 0.70   # vida útil mínima aceita no recebimento (estimativa)
  max_dock_exposure_min:                # tempo máximo de exposição na doca (estimativa)
    chilled: 30
    frozen: 15

# Fase 5 - produtividade e custo de mão de obra (ESTIMATIVAS de mercado, a calibrar com cronoanálise)
productivity:
  walk_speed_m_s: 1.0            # separador com paleteira elétrica, média com paradas
  reach_truck_speed_m_s: 1.5     # empilhadeira retrátil no corredor
  pick_time_per_line_s: 20       # pegar caixas na face e conferir (por linha)
  reserve_retrieval_s: 90        # retrátil baixa o palete do pulmão, separação e devolução
  replenish_time_s: 180          # um reabastecimento pulmão -> face (retrátil)
  relocation_time_s: 300         # remanejar 1 SKU de face (transição do slotting)
  travel_origin:                 # ponto de partida/chegada do separador (x, y em metros)
    dry: [72.5, 25.0]            # frente da área de consolidação/expedição do seco
    chilled: [164.0, 20.0]       # porta da antecâmara climatizada
    frozen: [164.0, 20.0]
labor_cost:                      # custo carregado (salário + encargos + benefícios), R$/hora
  picker_brl_h: 28.0
  reach_truck_brl_h: 45.0        # operador + custo horário do equipamento
